[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "work-os"
version = "0.1.0"
description = "Personal Work OS (Pilot): email + uploaded files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0",
  "google-genai>=0.3.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
work-os = "work_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
file_extract = [
  "pypdf>=4.2.0",
  "python-docx>=1.1.2",
]
outlook = [
  "pywin32>=306; platform_system=='Windows'",
]
